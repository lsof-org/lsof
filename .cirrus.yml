task:
  freebsd_instance:
    cpu: 1
    matrix:
      - image_name: freebsd-15-1-release-amd64-ufs
      - image_name: freebsd-14-5-release-amd64-ufs
  install_script: pkg install -y bash git autoconf automake libtool groff pkgconf
  kernel_src_script: |
    uname -r
    if [ ! -f /usr/src/sys/kern/kern_lockf.c ]; then
      rm -rf /usr/src
      rel=$(uname -r | sed 's/-p[0-9]*$//; s/-RELEASE$//')
      git clone --branch "releng/${rel}" https://git.FreeBSD.org/src.git /usr/src
    fi;
  build_script:
    - ./Configure -n freebsd
    - make
  test_script:
    - bash ./check.bash freebsd
  autotools_build_script:
    - git clean -fdx .
    - autoreconf -vif
    - ./configure
    - make
    - make install
  autotools_test_script:
    - make check
    - cat test-suite.log
    - make distcheck
